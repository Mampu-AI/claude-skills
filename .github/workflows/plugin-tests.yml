# The work-loop plugin's hook tests on the three systems the team uses. Most of the team is on Windows, where
# Claude Code runs plugin commands through Git Bash with backslashed paths; a bug that only shows there (the
# team tools' sign-in step, 22 Oct 2026) reached people before anyone saw it.
name: Plugin tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Make python3 available on Windows (the hooks call python3, as a normal Windows install provides)
        if: runner.os == 'Windows'
        run: |
          dir=$(dirname "$(command -v python)")
          cp "$dir/python.exe" "$dir/python3.exe"
      - name: Hook tests
        run: sh plugins/mampu-skills/tests/run.sh
